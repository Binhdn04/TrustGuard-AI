services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/p068
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-development-only-change-me}
      REDIS_URL: redis://redis:6379/0
      LIVE_PROVIDERS_REQUIRED: ${LIVE_PROVIDERS_REQUIRED:-false}
      RUN_DURABLE_WORKER: "false"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/p068
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-development-only-change-me}
      REDIS_URL: redis://redis:6379/0
      LIVE_PROVIDERS_REQUIRED: ${LIVE_PROVIDERS_REQUIRED:-false}
      RUN_DURABLE_WORKER: "true"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        NEXT_PUBLIC_DEMO_USER_TOKEN: ${DEMO_USER_TOKEN:-}
        NEXT_PUBLIC_DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-}
        NEXT_PUBLIC_OIDC_LOGIN_URL: ${NEXT_PUBLIC_OIDC_LOGIN_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    environment:
      POSTGRES_DB: p068
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d p068"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
