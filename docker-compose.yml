services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/p068
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-development-only-change-me}
      REDIS_URL: redis://redis:6379/0
      LIVE_PROVIDERS_REQUIRED: ${LIVE_PROVIDERS_REQUIRED:-false}
      SECURITY_AI_UNDERSTANDING_ENABLED: ${SECURITY_AI_UNDERSTANDING_ENABLED:-false}
      SECURITY_AI_PLANNING_ENABLED: ${SECURITY_AI_PLANNING_ENABLED:-false}
      SECURITY_AI_EXPLANATION_ENABLED: ${SECURITY_AI_EXPLANATION_ENABLED:-false}
      SECURITY_ASYNC_EXECUTION_ENABLED: ${SECURITY_ASYNC_EXECUTION_ENABLED:-false}
      SECURITY_MEMORY_RETRIEVAL_ENABLED: ${SECURITY_MEMORY_RETRIEVAL_ENABLED:-false}
      SECURITY_ADMIN_COPILOT_ENABLED: ${SECURITY_ADMIN_COPILOT_ENABLED:-false}
      SECURITY_RELEASE_PROFILE: ${SECURITY_RELEASE_PROFILE:-pre_cutover}
      RUN_DURABLE_WORKER: "false"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/p068
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-development-only-change-me}
      REDIS_URL: redis://redis:6379/0
      LIVE_PROVIDERS_REQUIRED: ${LIVE_PROVIDERS_REQUIRED:-false}
      SECURITY_AI_UNDERSTANDING_ENABLED: ${SECURITY_AI_UNDERSTANDING_ENABLED:-false}
      SECURITY_AI_PLANNING_ENABLED: ${SECURITY_AI_PLANNING_ENABLED:-false}
      SECURITY_AI_EXPLANATION_ENABLED: ${SECURITY_AI_EXPLANATION_ENABLED:-false}
      SECURITY_ASYNC_EXECUTION_ENABLED: ${SECURITY_ASYNC_EXECUTION_ENABLED:-false}
      SECURITY_MEMORY_RETRIEVAL_ENABLED: ${SECURITY_MEMORY_RETRIEVAL_ENABLED:-false}
      SECURITY_ADMIN_COPILOT_ENABLED: ${SECURITY_ADMIN_COPILOT_ENABLED:-false}
      SECURITY_RELEASE_PROFILE: ${SECURITY_RELEASE_PROFILE:-pre_cutover}
      RUN_DURABLE_WORKER: "true"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEMO_USER_TOKEN: ${DEMO_USER_TOKEN:-}
        NEXT_PUBLIC_DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-}
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-}
        NEXT_PUBLIC_OIDC_AUDIENCE: ${NEXT_PUBLIC_OIDC_AUDIENCE:-}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-}
        NEXT_PUBLIC_OIDC_AUTHORIZATION_ENDPOINT: ${NEXT_PUBLIC_OIDC_AUTHORIZATION_ENDPOINT:-}
        NEXT_PUBLIC_OIDC_TOKEN_ENDPOINT: ${NEXT_PUBLIC_OIDC_TOKEN_ENDPOINT:-}
        NEXT_PUBLIC_OIDC_LOGOUT_URL: ${NEXT_PUBLIC_OIDC_LOGOUT_URL:-}
        NEXT_PUBLIC_OIDC_ROLES_CLAIM: ${NEXT_PUBLIC_OIDC_ROLES_CLAIM:-roles}
        NEXT_PUBLIC_OIDC_ADMIN_ROLE: ${NEXT_PUBLIC_OIDC_ADMIN_ROLE:-security_admin}
        NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-openid profile email offline_access}
        NEXT_PUBLIC_OIDC_LOGIN_URL: ${NEXT_PUBLIC_OIDC_LOGIN_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: p068
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d p068"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
