name: Deploy to Railway

on:
  push:
    branches:
      - main
    # Run only when a production build input changes. Documentation and test
    # files are intentionally excluded by this allowlist.
    paths:
      - "src/**"
      - "migrations/**"
      - "Dockerfile"
      - "railway.backend.json"
      - "railway.worker.json"
      - "requirements.txt"
      - "alembic.ini"
      - ".dockerignore"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/Dockerfile"
      - "frontend/railway.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/next.config.ts"
      - "frontend/postcss.config.mjs"
      - "frontend/tsconfig.json"
      - "frontend/.dockerignore"
      - "!**/*.md"
      - "!tests/**"
      - "!**/tests/**"
      - "!frontend/e2e/**"
      - "!frontend/src/test/**"
  workflow_dispatch:

permissions:
  # Successful deployments advance service-specific Git tags, which are the
  # durable actual-state record used by the next reconciliation.
  contents: write

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect affected services
    runs-on: [self-hosted, linux, x64, p068]
    outputs:
      desired_sha: ${{ steps.services.outputs.desired_sha }}
      backend: ${{ steps.services.outputs.backend }}
      worker: ${{ steps.services.outputs.worker }}
      frontend: ${{ steps.services.outputs.frontend }}
      backend_tag_ref: ${{ steps.services.outputs.backend_tag_ref }}
      worker_tag_ref: ${{ steps.services.outputs.worker_tag_ref }}
      frontend_tag_ref: ${{ steps.services.outputs.frontend_tag_ref }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile desired revision with deployed revisions
        id: services
        shell: bash
        run: |
          set -euo pipefail

          # The desired state is the current main revision, not the event's
          # previous SHA.  Tags are advanced only after `railway up` succeeds.
          git fetch --force origin main --tags
          desired_sha="$(git rev-parse origin/main)"

          deployed_tag_ref() {
            # Keep the tag object's SHA as a compare-and-swap lease.  This is
            # deliberately distinct from the peeled commit SHA used for diff.
            git rev-parse -q --verify "refs/tags/deploy/$1" || true
          }

          service_changed() {
            local service="$1"
            local deployed_tag="deploy/${service}"
            local actual_sha

            if ! actual_sha="$(git rev-parse -q --verify "${deployed_tag}^{commit}")"; then
              echo "${service}: no successful deployment tag; deployment required."
              return 0
            fi

            echo "${service}: desired=${desired_sha}, actual=${actual_sha}"
            while IFS= read -r changed_path; do
              case "${changed_path}" in
                *.md|tests/*|*/tests/*|frontend/e2e/*|frontend/src/test/*)
                  continue
                  ;;
              esac

              case "${service}:${changed_path}" in
                backend:src/*|backend:Dockerfile|backend:requirements.txt|backend:.dockerignore|backend:migrations/*|backend:alembic.ini|backend:railway.backend.json)
                  return 0
                  ;;
                worker:src/*|worker:Dockerfile|worker:requirements.txt|worker:.dockerignore|worker:railway.worker.json)
                  return 0
                  ;;
                frontend:frontend/src/*|frontend:frontend/public/*|frontend:frontend/Dockerfile|frontend:frontend/railway.json|frontend:frontend/package.json|frontend:frontend/package-lock.json|frontend:frontend/next.config.ts|frontend:frontend/postcss.config.mjs|frontend:frontend/tsconfig.json|frontend:frontend/.dockerignore)
                  return 0
                  ;;
              esac
            done < <(git diff --name-only "${actual_sha}" "${desired_sha}")

            return 1
          }

          backend=false
          worker=false
          frontend=false
          backend_tag_ref="$(deployed_tag_ref backend)"
          worker_tag_ref="$(deployed_tag_ref worker)"
          frontend_tag_ref="$(deployed_tag_ref frontend)"
          service_changed backend && backend=true || true
          service_changed worker && worker=true || true
          service_changed frontend && frontend=true || true

          echo "desired_sha=${desired_sha}" >> "${GITHUB_OUTPUT}"
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "worker=${worker}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "backend_tag_ref=${backend_tag_ref}" >> "${GITHUB_OUTPUT}"
          echo "worker_tag_ref=${worker_tag_ref}" >> "${GITHUB_OUTPUT}"
          echo "frontend_tag_ref=${frontend_tag_ref}" >> "${GITHUB_OUTPUT}"

  lint-and-test:
    name: Lint and test
    needs: changes
    runs-on: [self-hosted, linux, x64, p068]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.desired_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  deploy:
    name: Deploy production services
    needs:
      - changes
      - lint-and-test
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, linux, x64, p068]
    timeout-minutes: 60
    environment: production

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.desired_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Railway token
        shell: bash
        run: |
          if [[ -z "${RAILWAY_TOKEN}" ]]; then
            echo "RAILWAY_TOKEN is not configured for this repository or environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Show Railway CLI version
        run: railway --version

      # Backend runs `alembic upgrade head` through railway.backend.json.
      # Deploy sequentially so the worker never starts new code before
      # the database migration has completed successfully.
      # - name: Check Railway authentication
      #   run: |
      #     railway status
                
      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: railway up --service backend --message "GitHub Actions ${{ needs.changes.outputs.desired_sha }}"

      - name: Record backend deployment
        if: needs.changes.outputs.backend == 'true'
        env:
          DESIRED_SHA: ${{ needs.changes.outputs.desired_sha }}
          EXPECTED_TAG_REF: ${{ needs.changes.outputs.backend_tag_ref }}
        run: |
          git tag -f deploy/backend "${DESIRED_SHA}"
          git push --force-with-lease="refs/tags/deploy/backend:${EXPECTED_TAG_REF}" origin refs/tags/deploy/backend

      - name: Deploy worker
        if: needs.changes.outputs.worker == 'true'
        run: railway up --service worker --message "GitHub Actions ${{ needs.changes.outputs.desired_sha }}"

      - name: Record worker deployment
        if: needs.changes.outputs.worker == 'true'
        env:
          DESIRED_SHA: ${{ needs.changes.outputs.desired_sha }}
          EXPECTED_TAG_REF: ${{ needs.changes.outputs.worker_tag_ref }}
        run: |
          git tag -f deploy/worker "${DESIRED_SHA}"
          git push --force-with-lease="refs/tags/deploy/worker:${EXPECTED_TAG_REF}" origin refs/tags/deploy/worker

      - name: Deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        run: railway up --service frontend --message "GitHub Actions ${{ needs.changes.outputs.desired_sha }}"

      - name: Record frontend deployment
        if: needs.changes.outputs.frontend == 'true'
        env:
          DESIRED_SHA: ${{ needs.changes.outputs.desired_sha }}
          EXPECTED_TAG_REF: ${{ needs.changes.outputs.frontend_tag_ref }}
        run: |
          git tag -f deploy/frontend "${DESIRED_SHA}"
          git push --force-with-lease="refs/tags/deploy/frontend:${EXPECTED_TAG_REF}" origin refs/tags/deploy/frontend

      - name: Write deployment summary
        if: success()
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_WORKER: ${{ needs.changes.outputs.worker }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          {
            echo "## Railway deployment"
            echo ""
            echo "Successfully deployed:"
            [[ "${DEPLOY_BACKEND}" == "true" ]] && echo "- \`backend\`"
            [[ "${DEPLOY_WORKER}" == "true" ]] && echo "- \`worker\`"
            [[ "${DEPLOY_FRONTEND}" == "true" ]] && echo "- \`frontend\`"
            echo ""
            echo "Desired commit: \`${{ needs.changes.outputs.desired_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  clean:
    name: Clean workflow workspace
    needs:
      - changes
      - lint-and-test
      - deploy
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64, p068]

    steps:
      - name: Clean GitHub job temp and workspace
        shell: bash
        run: |
          set -euo pipefail

          clean_contents() {
            local variable_name="$1"
            local target="${!variable_name:-}"
            local canonical_target
            local protected_home="${HOME:-}"

            if [[ -z "${target}" ]] \
              || [[ "${target}" != /* ]] \
              || [[ ! -d "${target}" ]] \
              || [[ -L "${target}" ]]; then
              echo "${variable_name} is not a safe cleanup directory; refusing to clean."
              exit 1
            fi

            canonical_target="$(realpath -e -- "${target}")"
            if [[ -n "${protected_home}" && -d "${protected_home}" ]]; then
              protected_home="$(realpath -e -- "${protected_home}")"
            fi

            if [[ "${canonical_target}" == "/" ]] \
              || [[ -n "${protected_home}" && "${canonical_target}" == "${protected_home}" ]]; then
              echo "${variable_name} resolves to a protected directory; refusing to clean."
              exit 1
            fi

            # Delete children only. Never delete or modify the runner install.
            find "${canonical_target}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          }

          runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
          runner_workspace="$(dirname -- "${runner_temp}")"
          github_workspace="$(realpath -e -- "${GITHUB_WORKSPACE}")"

          if [[ "${runner_workspace}" == "/" ]] \
            || [[ "${github_workspace}" != "${runner_workspace}/"* ]]; then
            echo "GITHUB_WORKSPACE is outside the runner workspace; refusing to clean."
            exit 1
          fi

          clean_contents RUNNER_TEMP
          clean_contents GITHUB_WORKSPACE
