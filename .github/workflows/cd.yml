name: Deploy to Railway

on:
  push:
    branches:
      - main
    # Run only when a production build input changes. Documentation and test
    # files are intentionally excluded by this allowlist.
    paths:
      - "src/**"
      - "migrations/**"
      - "Dockerfile"
      - "railway.backend.json"
      - "railway.worker.json"
      - "requirements.txt"
      - "alembic.ini"
      - ".dockerignore"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/Dockerfile"
      - "frontend/railway.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/next.config.ts"
      - "frontend/postcss.config.mjs"
      - "frontend/tsconfig.json"
      - "frontend/.dockerignore"
      - "!**/*.md"
      - "!tests/**"
      - "!**/tests/**"
      - "!frontend/e2e/**"
      - "!frontend/src/test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect affected services
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.services.outputs.backend }}
      worker: ${{ steps.services.outputs.worker }}
      frontend: ${{ steps.services.outputs.frontend }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect production build changes
        id: services
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          backend=false
          worker=false
          frontend=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]] \
            || [[ -z "${BEFORE_SHA}" ]] \
            || [[ "${BEFORE_SHA}" =~ ^0+$ ]] \
            || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            backend=true
            worker=true
            frontend=true
          else
            while IFS= read -r changed_path; do
              case "${changed_path}" in
                *.md|tests/*|*/tests/*|frontend/e2e/*|frontend/src/test/*)
                  continue
                  ;;
              esac

              case "${changed_path}" in
                src/*|Dockerfile|requirements.txt|.dockerignore)
                  backend=true
                  worker=true
                  ;;
                migrations/*|alembic.ini|railway.backend.json)
                  backend=true
                  ;;
                railway.worker.json)
                  worker=true
                  ;;
                frontend/src/*|frontend/public/*|frontend/Dockerfile|frontend/railway.json|frontend/package.json|frontend/package-lock.json|frontend/next.config.ts|frontend/postcss.config.mjs|frontend/tsconfig.json|frontend/.dockerignore)
                  frontend=true
                  ;;
              esac
            done < <(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
          fi

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "worker=${worker}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"

  lint-and-test:
    name: Lint and test
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  deploy:
    name: Deploy production services
    needs:
      - changes
      - lint-and-test
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    environment: production

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Railway token
        shell: bash
        run: |
          if [[ -z "${RAILWAY_TOKEN}" ]]; then
            echo "RAILWAY_TOKEN is not configured for this repository or environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Show Railway CLI version
        run: railway --version

      # Backend runs `alembic upgrade head` through railway.backend.json.
      # Deploy sequentially so the worker never starts new code before
      # the database migration has completed successfully.
      # - name: Check Railway authentication
      #   run: |
      #     railway status
                
      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: railway up --service backend --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy worker
        if: needs.changes.outputs.worker == 'true'
        run: railway up --service worker --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        run: railway up --service frontend --message "GitHub Actions ${GITHUB_SHA}"

      - name: Write deployment summary
        if: success()
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_WORKER: ${{ needs.changes.outputs.worker }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          {
            echo "## Railway deployment"
            echo ""
            echo "Successfully deployed:"
            [[ "${DEPLOY_BACKEND}" == "true" ]] && echo "- \`backend\`"
            [[ "${DEPLOY_WORKER}" == "true" ]] && echo "- \`worker\`"
            [[ "${DEPLOY_FRONTEND}" == "true" ]] && echo "- \`frontend\`"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
