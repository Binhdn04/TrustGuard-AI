name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  # lint-and-test:
  #   name: Lint and test
  #   runs-on: self-hosted
  #   timeout-minutes: 20

  #   steps:
  #     - name: Check out repository
  #       uses: actions/checkout@v5

  #     - name: Set up Python
  #       uses: actions/setup-python@v6
  #       with:
  #         python-version: "3.11"
  #         cache: pip
  #         cache-dependency-path: |
  #           requirements.txt
  #           requirements-dev.txt

  #     - name: Install dependencies
  #       run: pip install -r requirements-dev.txt

  #     - name: Lint with ruff
  #       run: ruff check src/ tests/

  #     - name: Run tests
  #       run: pytest tests/ -v --tb=short
  #       env:
  #         APP_ENV: test
  #         OPENAI_API_KEY: test-key

  deploy:
    name: Deploy production services
    #needs: lint-and-test
    runs-on: self-hosted
    timeout-minutes: 60
    environment: production

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Railway token
        shell: bash
        run: |
          if [[ -z "${RAILWAY_TOKEN}" ]]; then
            echo "RAILWAY_TOKEN is not configured for this repository or environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Show Railway CLI version
        run: railway --version

      # Backend runs `alembic upgrade head` through railway.backend.json.
      # Deploy sequentially so the worker never starts new code before
      # the database migration has completed successfully.
      # - name: Check Railway authentication
      #   run: |
      #     railway status
                
      - name: Deploy backend
        run: railway up --service backend --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy worker
        run: railway up --service worker --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy frontend
        run: railway up --service frontend --message "GitHub Actions ${GITHUB_SHA}"

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Railway deployment"
            echo ""
            echo "Successfully deployed \`backend\`, \`worker\`, and \`frontend\`."
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"