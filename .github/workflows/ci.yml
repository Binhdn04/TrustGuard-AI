name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, linux, x64, p068]

    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks scans only commits introduced by the pull request, but
          # needs both endpoints available locally to calculate that range.
          fetch-depth: 0

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          # `github.sha` is the pull-request merge commit.  Scanning this
          # range catches a secret even when it is added then deleted later in
          # the same PR, without failing on a previously remediated leak in
          # older repository history.
          git_range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config=/repo/.gitleaks.toml --log-opts="${git_range}" --redact=100 /repo

      - name: Scan pushed commits for secrets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          git_range="${{ github.event.before }}..${{ github.sha }}"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config=/repo/.gitleaks.toml --log-opts="${git_range}" --redact=100 /repo

  lint-and-test:
    runs-on: [self-hosted, linux, x64, p068]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -m "not integration" -v --tb=short --cov --cov-report=term-missing --cov-report=xml
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Upload backend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend-checks:
    name: Frontend checks
    runs-on: [self-hosted, linux, x64, p068]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 requires Node 22.22.2 or newer.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Enforce frontend cutover boundary
        run: npm run check:cutover

  postgres-integration:
    name: PostgreSQL integration
    runs-on: [self-hosted, linux, x64, p068]

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: p068_integration
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U app -d p068_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:${{ job.services.postgres.ports[5432] }}/p068_integration

      - name: Run PostgreSQL integration tests
        run: pytest tests/integration -o addopts= -m integration -v --tb=short
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:${{ job.services.postgres.ports[5432] }}/p068_integration

  clean:
    name: Clean workflow workspace
    needs:
      - lint-and-test
      - frontend-checks
      - postgres-integration
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64, p068]

    steps:
      - name: Clean GitHub job temp and workspace
        shell: bash
        run: |
          set -euo pipefail

          clean_contents() {
            local variable_name="$1"
            local target="${!variable_name:-}"
            local canonical_target
            local protected_home="${HOME:-}"

            if [[ -z "${target}" ]] \
              || [[ "${target}" != /* ]] \
              || [[ ! -d "${target}" ]] \
              || [[ -L "${target}" ]]; then
              echo "${variable_name} is not a safe cleanup directory; refusing to clean."
              exit 1
            fi

            canonical_target="$(realpath -e -- "${target}")"
            if [[ -n "${protected_home}" && -d "${protected_home}" ]]; then
              protected_home="$(realpath -e -- "${protected_home}")"
            fi

            if [[ "${canonical_target}" == "/" ]] \
              || [[ -n "${protected_home}" && "${canonical_target}" == "${protected_home}" ]]; then
              echo "${variable_name} resolves to a protected directory; refusing to clean."
              exit 1
            fi

            # Delete children only. Never delete or modify the runner install.
            find "${canonical_target}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          }

          runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
          runner_workspace="$(dirname -- "${runner_temp}")"
          github_workspace="$(realpath -e -- "${GITHUB_WORKSPACE}")"

          if [[ "${runner_workspace}" == "/" ]] \
            || [[ "${github_workspace}" != "${runner_workspace}/"* ]]; then
            echo "GITHUB_WORKSPACE is outside the runner workspace; refusing to clean."
            exit 1
          fi

          clean_contents RUNNER_TEMP
          clean_contents GITHUB_WORKSPACE
